{% extends "base.html" %}
{% block title %}Sign in{% endblock %}
{% block public %}
<div class="login-wrap">
  <div class="login-card">
    <div class="text-center mb-4">
      <div class="stat-icon tone-primary mx-auto mb-3"><i class="bi bi-house-heart-fill"></i></div>
      <h1 class="h4 mb-1">Home Finance</h1>
      <p class="text-muted mb-0">Owner sign in</p>
    </div>
    <div class="card"><div class="card-body p-4">
      <form method="post" novalidate>
        {{ form.hidden_tag() }}
        <div class="mb-3">
          <label class="form-label" for="username">Username</label>
          <input class="form-control form-control-lg" id="username" name="username" autocomplete="username" required autofocus>
        </div>
        <div class="mb-4">
          <label class="form-label" for="password">Password</label>
          <input class="form-control form-control-lg" id="password" name="password" type="password" autocomplete="current-password" required>
        </div>
        <button class="btn btn-primary btn-lg w-100" type="submit">Sign in</button>
      </form>
    </div></div>
  </div>
</div>
{% endblock %}
