<!doctype html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#4f46e5">
  <title>{% block title %}Dashboard{% endblock %} · Home Finance</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%234f46e5'/%3E%3Cpath d='M8 3 3 7.5V13h3.5V9.5h3V13H13V7.5z' fill='white'/%3E%3C/svg%3E">
  <script src="{{ url_for('static', filename='js/theme.js') }}"></script>
  <link rel="stylesheet" href="{{ url_for('static', filename='vendor/bootstrap.min.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='vendor/bootstrap-icons.min.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
</head>
<body>
{% if current_user.is_authenticated %}
<div class="app-shell">
  <aside class="sidebar d-none d-lg-flex flex-column">
    {% include "_nav.html" %}
  </aside>

  <div class="offcanvas offcanvas-start sidebar" tabindex="-1" id="navDrawer" aria-labelledby="navDrawerLabel">
    <div class="offcanvas-header pb-0">
      <span class="brand" id="navDrawerLabel"><i class="bi bi-house-heart-fill"></i> Home Finance</span>
      <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas" aria-label="Close"></button>
    </div>
    <div class="offcanvas-body d-flex flex-column">{% include "_nav.html" %}</div>
  </div>

  <div class="content">
    <header class="topbar">
      <button class="btn btn-icon d-lg-none" type="button" data-bs-toggle="offcanvas" data-bs-target="#navDrawer" aria-label="Open menu">
        <i class="bi bi-list fs-4"></i>
      </button>
      <span class="brand d-lg-none"><i class="bi bi-house-heart-fill"></i> Home Finance</span>
      <div class="ms-auto d-flex align-items-center gap-1">
        <button class="btn btn-icon" type="button" id="themeToggle" aria-label="Toggle dark mode"><i class="bi bi-moon-stars"></i></button>
        <a class="btn btn-icon" href="{{ url_for('auth.change_password') }}" aria-label="Change password" title="Change password"><i class="bi bi-key"></i></a>
        <form method="post" action="{{ url_for('auth.logout') }}" class="d-inline">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <button class="btn btn-icon" type="submit" aria-label="Sign out" title="Sign out"><i class="bi bi-box-arrow-right"></i></button>
        </form>
      </div>
    </header>
    <main class="page">
      {% include "_flash.html" %}
      {% block content %}{% endblock %}
    </main>
  </div>
</div>
{% else %}
<main class="container py-5">
  {% include "_flash.html" %}
  {% block public %}{% endblock %}
</main>
{% endif %}
<script src="{{ url_for('static', filename='vendor/bootstrap.bundle.min.js') }}"></script>
<script src="{{ url_for('static', filename='js/app.js') }}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
